<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6FA">
  <meta name="description" content="VAGGO — conectando você ao profissional ideal. Vagas e profissionais de serviços domésticos em um só lugar.">
  <title>VAGGO — Conectando você ao profissional ideal</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.documentElement.classList.add('js');
    // aplica o tema salvo antes de pintar a página (evita "piscar")
    try { if (localStorage.getItem('vaggo.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>

  <header class="topbar">
    <div class="wrap">
      <div class="topbar__in">
        <a class="brand" href="#inicio" aria-label="VAGGO — início">
          <!-- a logo em camadas (símbolo, cada letra e os detalhes azuis), para animar cada parte -->
          <span class="logo" aria-hidden="true">
            <span class="logo__sym">
              <img class="logo__v logo__ink" src="assets/logo/v.png" alt="" width="533" height="130">
              <span class="logo__orbit"><img src="assets/logo/orbit.png" alt="" width="533" height="130"><i class="logo__glint"></i></span>
            </span>
            <span class="logo__l" style="--i:0"><img class="logo__ink" src="assets/logo/l-v.png" alt="" width="533" height="130"></span>
            <span class="logo__l" style="--i:1"><img class="logo__ink" src="assets/logo/l-a.png" alt="" width="533" height="130"><img class="logo__door" src="assets/logo/a-door.png" alt="" width="533" height="130"></span>
            <span class="logo__l" style="--i:2"><img class="logo__ink" src="assets/logo/l-g1.png" alt="" width="533" height="130"><img class="logo__bar" style="--x:63.6%" src="assets/logo/a-bar1.png" alt="" width="533" height="130"></span>
            <span class="logo__l" style="--i:3"><img class="logo__ink" src="assets/logo/l-g2.png" alt="" width="533" height="130"><img class="logo__bar" style="--x:77.5%" src="assets/logo/a-bar2.png" alt="" width="533" height="130"></span>
            <span class="logo__l" style="--i:4"><img class="logo__ink" src="assets/logo/l-o.png" alt="" width="533" height="130"></span>
          </span>
        </a>
        <nav id="nav" aria-label="Principal"></nav>
        <div class="topbar__actions" id="actions"></div>
        <span class="topbar__progress" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <noscript>
      <p style="padding:40px 20px;text-align:center">O VAGGO precisa de JavaScript para funcionar. Ative-o no navegador e recarregue a página.</p>
    </noscript>
  </main>

  <footer id="footer"></footer>

  <dialog id="modal" aria-label="VAGGO"></dialog>
  <div id="toasts" aria-live="polite"></div>

  <!--
    Ordem de carregamento = ordem de dependência das classes.
    Scripts clássicos (sem "type=module") para o projeto abrir
    com dois cliques no index.html, sem precisar de servidor.
  -->
  <!-- núcleo -->
  <script src="js/core/errors.js"></script>
  <script src="js/core/enums.js"></script>
  <script src="js/core/I18n.js"></script>
  <script src="js/core/Theme.js"></script>
  <script src="js/core/ServiceGuide.js"></script>
  <!-- modelos (domínio) -->
  <script src="js/models/User.js"></script>
  <script src="js/models/Professional.js"></script>
  <script src="js/models/Employer.js"></script>
  <script src="js/models/Job.js"></script>
  <script src="js/models/Application.js"></script>
  <!-- serviços (regras e armazenamento) -->
  <script src="js/services/Storage.js"></script>
  <script src="js/services/MatchScore.js"></script>
  <script src="js/services/SeedData.js"></script>
  <script src="js/services/VaggoPlatform.js"></script>
  <!-- interface -->
  <script src="js/ui/UI.js"></script>
  <script src="js/ui/Motion.js"></script>
  <script src="js/ui/Dropdown.js"></script>
  <script src="js/ui/Portrait.js"></script>
  <script src="js/ui/Corridor.js"></script>
  <script src="js/ui/View.js"></script>
  <script src="js/ui/HomeView.js"></script>
  <script src="js/ui/ListViews.js"></script>
  <script src="js/ui/DashboardView.js"></script>
  <script src="js/ui/ProjectView.js"></script>
  <script src="js/ui/Dialogs.js"></script>
  <script src="js/ui/Header.js"></script>
  <script src="js/ui/App.js"></script>
</body>
</html>
